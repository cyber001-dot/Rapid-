  const $ = s => document.querySelector(s);
  const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a };
  const escapeHtml = s => String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));

  const ADMIN_PASSWORD = 'flkr2026';

  let custom = null;
  try{ custom = JSON.parse(localStorage.getItem('flkr_custom_facts')||'null') }catch{}
  const baseFacts = Array.isArray(custom) && custom.length ? custom : DEFAULT_FACTS;
  const facts = shuffle([...baseFacts]);

  // seed Nigeria ads on first load
  if(!localStorage.getItem('flkr_custom_ads')){
    try{ localStorage.setItem('flkr_custom_ads', JSON.stringify(NIGERIA_SAMPLE_ADS)) }catch{}
  }

  let customAds = null;
  try{ customAds = JSON.parse(localStorage.getItem('flkr_custom_ads')||'null') }catch{}
  const ads = Array.isArray(customAds) && customAds.length ? customAds : NIGERIA_SAMPLE_ADS;

  let liked = JSON.parse(localStorage.getItem('flkr_liked')||'[]');
  let pinned = JSON.parse(localStorage.getItem('flkr_pinned')||'[]');

  const today = new Date().toISOString().slice(0,10);
  let dailyData = JSON.parse(localStorage.getItem('flkr_daily')||'{}');
  if(dailyData.date !== today) dailyData = {date:today, count:0, viewed:[]};
  const viewedSet = new Set(dailyData.viewed||[]);
  const saveDaily = () => localStorage.setItem('flkr_daily', JSON.stringify({date:today, count:dailyData.count, viewed:[...viewedSet]}));

  let currentView = 'feed', currentCat = 'All', searchQuery = '';

  const feedEl = $('#feed');
  const likedCountEl = $('#likedCount');
  const dailyEl = $('#daily');

  function updateCounts(){
    likedCountEl.textContent = liked.length;
    dailyEl.textContent = `${dailyData.count} today`;
  }
  updateCounts();

  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const card = entry.target;
        const img = card.querySelector('img[data-src]');
        if(img){
          img.src = img.dataset.src;
          img.onload = () => {
            card.classList.add('loaded');
            if('caches' in window){
              caches.open('flkr-v9').then(c=>c.add(img.src).catch(()=>{}));
            }
          };
          img.removeAttribute('data-src');
        }
        const id = +card.dataset.id;
        if(id && !viewedSet.has(id)){
          viewedSet.add(id); dailyData.count++; saveDaily(); updateCounts();
          if(navigator.vibrate) navigator.vibrate(1);
        }
        observer.unobserve(card);
      }
    });
  }, {rootMargin:'200px 0px'});

  function getFacts(){
    let list = currentView==='feed' ? facts : facts.filter(f=>liked.includes(f.id));
    if(currentView==='liked'){
      list = list.sort((a,b)=> (pinned.includes(b.id)?1:0) - (pinned.includes(a.id)?1:0));
    }
    if(currentCat!=='All') list = list.filter(f=>f.category===currentCat);
    if(searchQuery) list = list.filter(f=> (f.fact+' '+f.source+' '+(f.category||'')).toLowerCase().includes(searchQuery));
    return list;
  }

  function toast(msg){
    const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t); setTimeout(()=>t.classList.add('show'),10);
    setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),200)},1800);
  }

  function toggleLike(id, btn){
    const i = liked.indexOf(id);
    if(i>-1) liked.splice(i,1); else liked.push(id);
    localStorage.setItem('flkr_liked', JSON.stringify(liked));
    const isLiked = i===-1;
    if(btn){
      btn.classList.toggle('active', isLiked);
      btn.querySelector('.heart').textContent = isLiked ? '♥' : '♡';
      const f = facts.find(x=>x.id===id);
      btn.querySelector('em').textContent = (f.likes||0) + (isLiked?1:0);
    }
    updateCounts();
    if(navigator.vibrate) navigator.vibrate(12);
    if(currentView==='liked') render();
  }

  function togglePin(id, btn){
    const i = pinned.indexOf(id);
    if(i>-1){ pinned.splice(i,1); btn.classList.remove('active'); }
    else{
      if(pinned.length>=3){ toast('Max 3 pins'); if(navigator.vibrate) navigator.vibrate([20,30]); return }
      pinned.push(id); btn.classList.add('active'); if(navigator.vibrate) navigator.vibrate(15);
    }
    localStorage.setItem('flkr_pinned', JSON.stringify(pinned));
    render();
  }

  function shareFact(f){
    const url = location.origin + location.pathname + '#' + f.id;
    const text = `${f.fact} — via flkr`;
    if(navigator.share){ navigator.share({title:'flkr', text, url}).catch(()=>{}) }
    else { navigator.clipboard.writeText(text + ' ' + url); toast('Link copied') }
    if(navigator.vibrate) navigator.vibrate(8);
  }

  function createCard(f){
    const card = document.createElement('article');
    card.className = 'card'; card.dataset.id = f.id;
    const imgUrl = f.img && f.img.trim() ? f.img : `https://picsum.photos/id/${(f.id*7)%1084}/800/1200`;
    const isLiked = liked.includes(f.id);
    card.innerHTML = `
      <div class="shimmer"></div>
      <img loading="lazy" data-src="${imgUrl}" alt="${escapeHtml(f.fact.slice(0,120))}" draggable="false">
      <div class="scrim"></div>
      <button class="flag" aria-label="Report">⚐</button>
      ${currentView==='liked'?`<button class="pin ${pinned.includes(f.id)?'active':''}" aria-label="Pin">📌</button>`:''}
      <div class="fact-wrap">
        <p class="fact">${f.fact}</p>
        <a class="source" href="${f.url||'#'}" target="_blank" rel="noopener">${f.source||'Source'} • ${f.category}</a>
      </div>
      <div class="actions">
        <button class="like ${isLiked?'active':''}" aria-label="Like"><span class="heart">${isLiked?'♥':'♡'}</span> <em>${(f.likes||0)+(isLiked?1:0)}</em></button>
        <button class="share" aria-label="Share">↗</button>
      </div>
    `;
    const likeBtn = card.querySelector('.like');
    likeBtn.onclick = e => { e.stopPropagation(); toggleLike(f.id, likeBtn) };
    card.querySelector('.share').onclick = e => { e.stopPropagation(); shareFact(f) };
    card.querySelector('.flag').onclick = e => { e.stopPropagation(); location.href = `mailto:hello@flkr.app?subject=Report fact #${f.id}&body=${encodeURIComponent(f.fact)}` };
    if(currentView==='liked') card.querySelector('.pin').onclick = e => { e.stopPropagation(); togglePin(f.id, e.currentTarget) };

    let pressTimer, moved=false, sx=0, sy=0;
    const start = e => { moved=false; const p=e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY; pressTimer=setTimeout(()=>{ if(!moved){ navigator.clipboard.writeText(f.fact); toast('Fact copied'); if(navigator.vibrate) navigator.vibrate(20) } },600) };
    const cancel = ()=> clearTimeout(pressTimer);
    const move = e => { const p=e.touches?e.touches[0]:e; if(Math.abs(p.clientX-sx)>10||Math.abs(p.clientY-sy)>10) moved=true };
    card.addEventListener('pointerdown', start); card.addEventListener('pointerup', cancel); card.addEventListener('pointerleave', cancel); card.addEventListener('pointermove', move);

    let tx=0, ty=0;
    card.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY }, {passive:true});
    card.addEventListener('touchend', e=>{
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if(Math.abs(dx)>80 && Math.abs(dy)<60){
        if(dx>0){ toggleLike(f.id, likeBtn); if(navigator.vibrate) navigator.vibrate([10,20,10]) }
        else { shareFact(f); if(navigator.vibrate) navigator.vibrate(10) }
      }
    });

    observer.observe(card);
    return card;
  }

  function createAdCard(ad){
    const card = document.createElement('article');
    card.className = 'card ad';
    card.dataset.ad = ad.id;
    const hasImg = ad.img && ad.img.trim();
    card.innerHTML = `
      ${hasImg ? `<div class="shimmer"></div><img loading="lazy" data-src="${ad.img}" alt="${escapeHtml(ad.title||'Sponsored')}" draggable="false"><div class="scrim" style="background:linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.35) 50%, transparent)"></div>` : ''}
      <div class="ad-inner">
        <span>SPONSORED</span>
        <h3>${escapeHtml(ad.title||'Sponsored')}</h3>
        <p>${escapeHtml(ad.subtitle||'')}</p>
      </div>
    `;
    if(ad.link){
      card.style.cursor='pointer';
      card.onclick = ()=> window.open(ad.link, '_blank', 'noopener');
    }
    if(hasImg) observer.observe(card);
    return card;
  }

  function render(){
    feedEl.innerHTML = '';
    const list = getFacts();

    if(currentView==='liked'){
      const bar = document.createElement('div');
      bar.className = 'toolbar';
      bar.innerHTML = `<div>${list.length} liked • ${pinned.length}/3 pinned</div><button id="exportBtn">Export</button>`;
      feedEl.appendChild(bar);
      bar.querySelector('#exportBtn').onclick = () => {
        const likedFacts = facts.filter(f=>liked.includes(f.id)).map(({id,fact,source,url,category})=>({id,fact,source,url,category}));
        const blob = new Blob([JSON.stringify(likedFacts,null,2)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'flkr-liked.json'; a.click();
        toast('Exported liked facts');
      };
    }

    if(!list.length){
      feedEl.innerHTML += `<div class="empty">${currentView==='liked'?'No liked facts yet. Tap ♥ on feed.':'No facts found.'}</div>`;
      return;
    }

    let adIndex = 0;
    list.forEach((f,i)=>{
      feedEl.appendChild(createCard(f));
      if(currentView==='feed' && (i+1)%5===0){
        const adData = ads[adIndex % ads.length];
        adIndex++;
        const ad = createAdCard(adData);
        feedEl.appendChild(ad);
      }
    });

    if(location.hash){
      const el = feedEl.querySelector(`[data-id="${location.hash.slice(1)}"]`);
      if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth', block:'center'}), 250);
    }
  }

  function updateAdminLockUI(){

    adminLink.style.opacity = '0.3';

    const interval = setInterval(()=>{
      const remaining = Math.ceil((lockoutUntil - Date.now())/1000);
      if(remaining <= 0){
        clearInterval(interval);
        adminLink.style.opacity = '';
        adminLink.style.pointerEvents = '';
        adminLink.textContent = 'admin';
        localStorage.removeItem('flkr_admin_fails');
        localStorage.removeItem('flkr_admin_lock');

        lockoutUntil = 0;

        adminLink.textContent = `locked ${remaining}s`;

    const val = adminPassword.value;
    if(val === ADMIN_PASSWORD){

      failedAttempts++;
      localStorage.setItem('flkr_admin_fails', failedAttempts);
      toast('Incorrect password');
      if(navigator.vibrate) navigator.vibrate([20,30]);
      adminPassword.value = '';
      adminPassword.focus();
      if(failedAttempts >= 3){
        lockoutUntil = Date.now() + 60000;
        localStorage.setItem('flkr_admin_lock', lockoutUntil);
        passwordModal.close();
        toast('Too many attempts. Locked for 60s');
        updateAdminLockUI();
      } else {
        attemptsHint.textContent = `${3 - failedAttempts} attempts remaining`;
        attemptsHint.style.color = '#ffb8c6';
      }
    }
  }

  passwordSubmit.onclick = handlePasswordSubmit;
  adminPassword.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); handlePasswordSubmit(); } };

  $('#saveAdmin').onclick = () => {
    try{
      const parsedFacts = JSON.parse(txt.value);
      if(!Array.isArray(parsedFacts)) throw new Error('Facts must be an array');
      const parsedAds = JSON.parse(adsTxt.value);
      if(!Array.isArray(parsedAds)) throw new Error('Ads must be an array');
      parsedAds.forEach((ad,i)=>{ if(!ad.id || !ad.title) throw new Error(`Ad #${i+1} missing id or title`) });
      localStorage.setItem('flkr_custom_facts', JSON.stringify(parsedFacts));
      localStorage.setItem('flkr_custom_ads', JSON.stringify(parsedAds));
      toast('Saved — reloading'); setTimeout(()=>location.reload(), 600);
    }catch(err){ alert('Invalid JSON: '+err.message) }
  };
  $('#resetAdmin').onclick = () => { 
    localStorage.removeItem('flkr_custom_facts'); 
    localStorage.removeItem('flkr_custom_ads'); 
    toast('Reset — reloading'); 
    setTimeout(()=>location.reload(), 600) 
  };

  render();

  if(location.hash){
    const id = +location.hash.slice(1);
    const idx = facts.findIndex(f=>f.id===id);
    if(idx>0){ const [item]=facts.splice(idx,1); facts.unshift(item); render() }
  }
})();
</script>
