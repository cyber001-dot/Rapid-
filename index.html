  <!-- Dark Mode Handler Script -->
  <script>
    (function() {
      const HTML_ELEMENT = document.documentElement;
      const STORAGE_KEY = 'theme-preference';
      
      // Initialize theme from localStorage or system preference
      function initTheme() {
        const stored = localStorage.getItem(STORAGE_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        const isDark = stored ? stored === 'dark' : prefersDark;
        setTheme(isDark);
      }
      
      // Set theme
      function setTheme(isDark) {
        if (isDark) {
          HTML_ELEMENT.classList.add('dark');
          document.getElementById('toggleIcon').textContent = '☀️';
          localStorage.setItem(STORAGE_KEY, 'dark');
        } else {
          HTML_ELEMENT.classList.remove('dark');
          document.getElementById('toggleIcon').textContent = '🌙';
          localStorage.setItem(STORAGE_KEY, 'light');
        }
      }
      
      // Toggle theme
      function toggleTheme() {
        const isDark = HTML_ELEMENT.classList.contains('dark');
        setTheme(!isDark);
      }
      
      // Attach toggle button listener
      document.getElementById('darkModeToggle').addEventListener('click', toggleTheme);
      
      // Listen for system theme changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem(STORAGE_KEY)) {
          setTheme(e.matches);
        }
      });
      
      // Initialize on load
      initTheme();
    })();
  </script>
